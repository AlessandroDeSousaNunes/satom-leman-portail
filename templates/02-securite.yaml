AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Portail Leman Finance - sprint 3 : groupes de securite sg-alb, sg-web, sg-app ;
  cle KMS du projet ; journaux de flux VPC chiffres (nLPD : journalisation des acces).

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    Default: ADSN
  SalleExploitation:
    Type: String
    Default: 213.55.246.163/32
    Description: Seule adresse autorisee en SSH (jamais 0.0.0.0/0)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(2[4-9]|3[0-2])$'
  RetentionJours:
    Type: Number
    Default: 365
    AllowedValues: [30, 90, 180, 365]

Resources:
  # ---------- Cle KMS du projet (journaux, volumes) ----------
  CleProjet:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Cle du portail Leman ${Environnement} (journaux, EBS)"
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AdministrationCompte
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"
          - Sid: AlarmesCloudWatchVersSns
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: [kms:Decrypt, kms:GenerateDataKey*]
            Resource: "*"
            Condition:
              StringEquals: {aws:SourceAccount: !Ref "AWS::AccountId"}
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: {Service: !Sub "logs.${AWS::Region}.amazonaws.com"}
            Action: [kms:Encrypt*, kms:Decrypt*, kms:ReEncrypt*, kms:GenerateDataKey*, kms:Describe*]
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/portail/*"
      Tags:
        - {Key: Name, Value: !Sub "kms-portail-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  AliasCleProjet:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/portail-${Environnement}-${Equipe}"
      TargetKeyId: !Ref CleProjet

  # ---------- Notification de l'equipe d'exploitation (alarmes) ----------
  SnsExploitation:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "sns-exploitation-portail-${Environnement}-${Equipe}"
      KmsMasterKeyId: !Ref CleProjet
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  # ---------- Groupes de securite ----------
  SgAlb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "alb-sg-portail-${Environnement}-${Equipe}"
      GroupDescription: ALB - HTTPS 443 depuis Internet uniquement
      VpcId: {"Fn::ImportValue": !Sub "portail-${Environnement}-VpcId"}
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: https-public}
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: {"Fn::ImportValue": !Sub "portail-${Environnement}-CidrVpc"}
          Description: vers-cibles-8080
      Tags:
        - {Key: Name, Value: !Sub "sg-alb-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  SgWeb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "web-sg-portail-${Environnement}-${Equipe}"
      GroupDescription: web - 443 ouvert, 80 et 8080 depuis l ALB, SSH depuis la salle d exploitation
      VpcId: {"Fn::ImportValue": !Sub "portail-${Environnement}-VpcId"}
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: https-public}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref SgAlb, Description: http-depuis-alb}
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref SgAlb, Description: app-depuis-alb}
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SalleExploitation, Description: ssh-salle-exploitation}
      Tags:
        - {Key: Name, Value: !Sub "sg-web-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  SgApp:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "app-sg-portail-${Environnement}-${Equipe}"
      GroupDescription: app - 8080 depuis sg-web uniquement
      VpcId: {"Fn::ImportValue": !Sub "portail-${Environnement}-VpcId"}
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref SgWeb, Description: api-depuis-web}
      Tags:
        - {Key: Name, Value: !Sub "sg-app-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  # ---------- Journaux de flux VPC, chiffres par KMS ----------
  GroupeJournauxFlux:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/portail/${Environnement}/flux-vpc"
      RetentionInDays: !Ref RetentionJours
      KmsKeyId: !GetAtt CleProjet.Arn
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  RoleJournauxFlux:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref "AWS::AccountId"}
      Policies:
        - PolicyName: ecriture-journaux-flux
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${GroupeJournauxFlux.Arn}:*"
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  JournalFlux:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: {"Fn::ImportValue": !Sub "portail-${Environnement}-VpcId"}
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref GroupeJournauxFlux
      DeliverLogsPermissionArn: !GetAtt RoleJournauxFlux.Arn
      MaxAggregationInterval: 60
      Tags:
        - {Key: Name, Value: !Sub "fl-portail-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

Outputs:
  SnsExploitation:
    Value: !Ref SnsExploitation
    Export: {Name: !Sub "portail-${Environnement}-SnsExploitation"}
  CleProjetArn:
    Value: !GetAtt CleProjet.Arn
    Export: {Name: !Sub "portail-${Environnement}-CleArn"}
  SgAlb:
    Value: !Ref SgAlb
    Export: {Name: !Sub "portail-${Environnement}-SgAlb"}
  SgWeb:
    Value: !Ref SgWeb
    Export: {Name: !Sub "portail-${Environnement}-SgWeb"}
  SgApp:
    Value: !Ref SgApp
    Export: {Name: !Sub "portail-${Environnement}-SgApp"}
