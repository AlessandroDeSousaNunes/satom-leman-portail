AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Portail Leman Finance - sprint 11 : AWS WAF regional associe a l'ALB (origine de CloudFront). Regles gerees
  AWS (reputation IP, jeu commun, entrees malveillantes) et limitation de debit par IP du visiteur
  (en-tete X-Forwarded-For pose par CloudFront). Le WAF de portee CLOUDFRONT exige us-east-1, region
  interdite au role de la pipeline par la SCP de l'organisation (ADR 0007).

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    Default: ADSN
  AvecCloudFront:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  LimiteRequetes:
    Type: Number
    Default: 500
    Description: Requetes maximum par IP de visiteur sur 5 minutes

Conditions:
  CreerWaf: !Equals [!Ref AvecCloudFront, "true"]

Resources:
  JournauxWaf:
    Type: AWS::Logs::LogGroup
    Condition: CreerWaf
    Properties:
      LogGroupName: !Sub "aws-waf-logs-portail-${Environnement}-${Equipe}"
      RetentionInDays: 30
      KmsKeyId: {"Fn::ImportValue": !Sub "portail-${Environnement}-CleArn"}

  AclWeb:
    Type: AWS::WAFv2::WebACL
    Condition: CreerWaf
    Properties:
      Name: !Sub "waf-portail-${Environnement}-${Equipe}"
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "waf-portail-${Environnement}"
      Rules:
        - Name: limitation-debit-ip-visiteur
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref LimiteRequetes
              AggregateKeyType: FORWARDED_IP
              ForwardedIPConfig: {HeaderName: X-Forwarded-For, FallbackBehavior: MATCH}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: limitation-debit-ip}
        - Name: aws-reputation-ip
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-reputation-ip}
        - Name: aws-jeu-commun
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-jeu-commun}
        - Name: aws-entrees-malveillantes
          Priority: 3
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-entrees-malveillantes}
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  JournalisationWaf:
    Type: AWS::WAFv2::LoggingConfiguration
    Condition: CreerWaf
    Properties:
      ResourceArn: !GetAtt AclWeb.Arn
      LogDestinationConfigs: [!GetAtt JournauxWaf.Arn]

Outputs:
  AclWebArn:
    Condition: CreerWaf
    Value: !GetAtt AclWeb.Arn
    Export: {Name: !Sub "portail-${Environnement}-AclWeb"}
