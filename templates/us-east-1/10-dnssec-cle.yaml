AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Portail Leman Finance - sprint 10 : cle KMS asymetrique de signature DNSSEC (ECC_NIST_P256).
  Route 53 impose une cle en us-east-1 ; cette pile est deployee dans cette region par la pipeline.

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    Default: ADSN

Resources:
  CleDnssec:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Signature DNSSEC de la zone publique du portail ${Environnement}"
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: false  # non supportee pour les cles asymetriques
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AdministrationCompte
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"
          - Sid: SignatureRoute53
            Effect: Allow
            Principal: {Service: dnssec-route53.amazonaws.com}
            Action: [kms:DescribeKey, kms:GetPublicKey, kms:Sign]
            Resource: "*"
            Condition:
              StringEquals: {aws:SourceAccount: !Ref "AWS::AccountId"}
          - Sid: AutorisationRoute53
            Effect: Allow
            Principal: {Service: dnssec-route53.amazonaws.com}
            Action: kms:CreateGrant
            Resource: "*"
            Condition:
              Bool: {kms:GrantIsForAWSResource: true}
      Tags:
        - {Key: Name, Value: !Sub "kms-dnssec-portail-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

Outputs:
  CleDnssecArn:
    Value: !GetAtt CleDnssec.Arn
