AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Portail Leman Finance - sprints 1 et 2 : VPC, sous-reseaux publics et prives sur deux zones,
  sous-reseau du pare-feu, Internet Gateway, tables de routage et NAT Gateway optionnelle.

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    Default: ADSN
  CidrVpc:
    Type: String
    Description: CIDR du VPC principal (/16), 10.0.0.0/16 en prod
    AllowedPattern: '^10\.(\d{1,3})\.0\.0/16$'
  AvecNat:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: NAT Gateway facturee a l'heure, creee seulement pendant les sessions de travail

Conditions:
  CreerNat: !Equals [!Ref AvecNat, "true"]

Mappings:
  # Index des /24 (ou /28) dans le /16 : 10.x.1.0 public 1a, 10.x.5.0 public 1b (sprint 1),
  # 10.x.2.0 prive 1a, 10.x.6.0 prive 1b, 10.x.4.0/28 pare-feu (sprint 4)
  Plan:
    Index: {Public1a: 1, Public1b: 5, Prive1a: 2, Prive1b: 6}

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref CidrVpc
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub "vpc-portail-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  # ---------- Sous-reseaux ----------
  SubPublic1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Plan, Index, Public1a], !Cidr [!Ref CidrVpc, 256, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "sub-public-1a-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}
        - {Key: Niveau, Value: public}
        - {Key: kubernetes.io/role/elb, Value: "1"}

  SubPublic1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Plan, Index, Public1b], !Cidr [!Ref CidrVpc, 256, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "sub-public-1b-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}
        - {Key: Niveau, Value: public}
        - {Key: kubernetes.io/role/elb, Value: "1"}

  SubPrive1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Plan, Index, Prive1a], !Cidr [!Ref CidrVpc, 256, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "sub-prive-1a-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}
        - {Key: Niveau, Value: prive}
        - {Key: kubernetes.io/role/internal-elb, Value: "1"}

  SubPrive1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Plan, Index, Prive1b], !Cidr [!Ref CidrVpc, 256, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "sub-prive-1b-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}
        - {Key: Niveau, Value: prive}
        - {Key: kubernetes.io/role/internal-elb, Value: "1"}

  SubFw1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Select [4, !Cidr [!Ref CidrVpc, 256, 8]], 16, 4]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "sub-fw-1a-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}
        - {Key: Niveau, Value: pare-feu}

  # ---------- Internet Gateway et table publique (sprint 2) ----------
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub "igw-portail-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  IgwAttachement:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  RtPublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "rt-public-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  RoutePublicInternet:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachement
    Properties:
      RouteTableId: !Ref RtPublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  AssocPublic1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref RtPublic, SubnetId: !Ref SubPublic1a}

  AssocPublic1b:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref RtPublic, SubnetId: !Ref SubPublic1b}

  # ---------- Table privee : 0.0.0.0/0 vers la NAT, jamais vers l'IGW ----------
  RtPrive:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "rt-prive-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  AssocPrive1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref RtPrive, SubnetId: !Ref SubPrive1a}

  AssocPrive1b:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref RtPrive, SubnetId: !Ref SubPrive1b}

  EipNat:
    Type: AWS::EC2::EIP
    Condition: CreerNat
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub "eip-nat-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  Nat:
    Type: AWS::EC2::NatGateway
    Condition: CreerNat
    Properties:
      AllocationId: !GetAtt EipNat.AllocationId
      SubnetId: !Ref SubPublic1a
      Tags:
        - {Key: Name, Value: !Sub "nat-portail-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  RoutePriveNat:
    Type: AWS::EC2::Route
    Condition: CreerNat
    Properties:
      RouteTableId: !Ref RtPrive
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Nat

  # ---------- NACL (sprint 3) ----------
  NaclPublic:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "nacl-public-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  NaclPublicEntreeHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 443, To: 443}

  NaclPublicEntreeVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 110
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref CidrVpc

  NaclPublicEntreeRetours:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 1024, To: 65535}

  NaclPublicSortie:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 100
      Egress: true
      Protocol: -1
      RuleAction: allow
      CidrBlock: 0.0.0.0/0

  NaclPublicAssoc1a:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {NetworkAclId: !Ref NaclPublic, SubnetId: !Ref SubPublic1a}

  NaclPublicAssoc1b:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {NetworkAclId: !Ref NaclPublic, SubnetId: !Ref SubPublic1b}

  NaclPrive:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "nacl-prive-${Environnement}-${Equipe}"}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: !Ref Equipe}
        - {Key: Environnement, Value: !Ref Environnement}

  NaclPriveEntreeVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPrive
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref CidrVpc

  NaclPriveEntreeRetours:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPrive
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 1024, To: 65535}

  NaclPriveSortie:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPrive
      RuleNumber: 100
      Egress: true
      Protocol: -1
      RuleAction: allow
      CidrBlock: 0.0.0.0/0

  NaclPriveAssoc1a:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {NetworkAclId: !Ref NaclPrive, SubnetId: !Ref SubPrive1a}

  NaclPriveAssoc1b:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {NetworkAclId: !Ref NaclPrive, SubnetId: !Ref SubPrive1b}

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: {Name: !Sub "portail-${Environnement}-VpcId"}
  CidrVpc:
    Value: !Ref CidrVpc
    Export: {Name: !Sub "portail-${Environnement}-CidrVpc"}
  SubPublic1a:
    Value: !Ref SubPublic1a
    Export: {Name: !Sub "portail-${Environnement}-SubPublic1a"}
  SubPublic1b:
    Value: !Ref SubPublic1b
    Export: {Name: !Sub "portail-${Environnement}-SubPublic1b"}
  SubPrive1a:
    Value: !Ref SubPrive1a
    Export: {Name: !Sub "portail-${Environnement}-SubPrive1a"}
  SubPrive1b:
    Value: !Ref SubPrive1b
    Export: {Name: !Sub "portail-${Environnement}-SubPrive1b"}
  SubFw1a:
    Value: !Ref SubFw1a
    Export: {Name: !Sub "portail-${Environnement}-SubFw1a"}
  RtPublic:
    Value: !Ref RtPublic
    Export: {Name: !Sub "portail-${Environnement}-RtPublic"}
  RtPrive:
    Value: !Ref RtPrive
    Export: {Name: !Sub "portail-${Environnement}-RtPrive"}
