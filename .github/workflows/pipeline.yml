# Pipeline DevSecOps du portail Léman Finance (section 2.1 du TP, 7 étapes).
# Étapes 1 à 3 : à chaque pull request et à chaque push sur main.
# Étapes 4 et 5 : sur main, quand la variable de dépôt AWS_DEPLOIEMENT vaut "true".
# Étapes 6 et 7 : sur demande (workflow_dispatch prod=true), après validation du relecteur.
# (les ressources AWS facturées à l'heure ne sont créées que pendant les sessions de travail).
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prod:
        description: Enchaîner sur la mise en prod (validation manuelle du relecteur obligatoire)
        type: boolean
        default: false
      confirmer_remplacement:
        description: Confirmer les remplacements annoncés par les jeux de modifications (après relecture)
        type: boolean
        default: false
      ordre_inverse:
        description: Déployer les piles en ordre inverse (démontage en fin de session)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  IMAGE: ghcr.io/alessandrodesousanunes/satom-leman-portail  # minuscules obligatoires (OCI)
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- 1
  qualite:
    name: 1 · Qualité de code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: app/requirements-dev.txt}
      - name: Dépendances
        run: pip install -r app/requirements-dev.txt cfn-lint
      - name: cfn-lint (templates CloudFormation)
        run: cfn-lint templates/*.yaml
      - name: ruff (lint et format du code applicatif et des scripts)
        run: |
          ruff check app tests scripts --output-format=github
          ruff format --check app tests scripts
      - name: Tests unitaires et couverture (seuil 80 %)
        run: pytest
      - uses: actions/upload-artifact@v7.0.2
        with: {name: couverture, path: coverage.xml}
      - name: Analyse SonarQube Cloud et quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------- 2
  securite:
    name: 2 · Sécurité statique
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Outils
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install checkov pip-audit semgrep
          # cfn-guard : version figée, téléchargée par gh authentifié (évite la limite anonyme de l'API GitHub)
          gh release download 3.3.0 -R aws-cloudformation/cloudformation-guard             --pattern 'cfn-guard-v3-x86_64-linux-latest.tar.gz' -D /tmp/guard
          tar -xzf /tmp/guard/cfn-guard-v3-x86_64-linux-latest.tar.gz -C /tmp/guard
          echo "$(dirname "$(find /tmp/guard -type f -name cfn-guard | head -1)")" >> "$GITHUB_PATH"
      - name: cfn-guard (règles du projet)
        run: cfn-guard validate --rules policies/cfn-guard --data templates --show-summary all
      - name: checkov IaC (CloudFormation)
        run: checkov -d templates --framework cloudformation --compact
      - name: checkov Kubernetes et Dockerfile
        # Digest d'image injecté à l'étape 4 : CKV_K8S_14/43 vérifiés sur le rendu final (étape 4)
        run: |
          checkov -d k8s --framework kubernetes --compact --skip-check CKV_K8S_14,CKV_K8S_43
          checkov -f Dockerfile --compact
      - name: Chevauchement des CIDR (sprint 5)
        run: python scripts/verifier_cidr.py
      - name: Semgrep (SAST)
        run: semgrep scan --config p/python --config p/flask --config p/secrets --severity ERROR --error --metrics off app scripts
      - name: gitleaks (secrets dans le dépôt et l'historique)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: pip-audit (dépendances Python)
        run: pip-audit -r app/requirements.txt --strict
      - name: Trivy (dépendances et configuration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: docs

  # ---------------------------------------------------------------- 3
  construction:
    name: 3 · Image, SBOM et signature
    needs: [qualite, securite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction (et publication sur main)
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          provenance: false
      - name: Scan Trivy de l'image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM CycloneDX (Syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom/portail-${{ github.sha }}.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7.0.2
        with: {name: sbom, path: sbom/}
      - name: Signature cosign (sans clé, OIDC GitHub)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.3
      - name: Signer l'image et attacher le SBOM
        if: github.event_name != 'pull_request'
        run: |
          REF="${IMAGE}@${{ steps.image.outputs.digest }}"
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate "sbom/portail-${GITHUB_SHA}.cdx.json" "$REF"
          cosign verify "$REF" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Image signée et vérifiée : $REF" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 4
  deploiement-dev:
    name: 4 · Déploiement dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOIEMENT == 'true'
    needs: construction
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Piles CloudFormation par jeu de modifications
        env:
          CONFIRMER: ${{ inputs.confirmer_remplacement && '--confirmer-remplacement' || '' }}
          # démontage en fin de session : ordre inverse (les piles qui importent une sortie partent avant)
          ORDRE: ${{ inputs.ordre_inverse && 'inverse' || 'normal' }}
          # paramètre sensible (contient le numéro de compte) : fourni par les secrets, jamais par le dépôt
          PARAM_RoleDeploiementArn: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
          pip install boto3
          # sprint 10 : clé DNSSEC en us-east-1 (exigence Route 53), puis valeurs transmises aux piles
          if [ "$(jq -r .AvecDns parameters/dev.json)" = true ]; then
            python scripts/deployer.py templates/us-east-1/10-dnssec-cle.yaml parameters/dev.json \
              --region us-east-1 --role-cfn "${{ secrets.CFN_ROLE_ARN }}" $CONFIRMER
            CLE=$(aws cloudformation describe-stacks --region us-east-1 --stack-name portail-dev-dnssec-cle \
              --query "Stacks[0].Outputs[?OutputKey=='CleDnssecArn'].OutputValue" --output text)
            echo "PARAM_CleDnssecArn=$CLE" >> "$GITHUB_ENV"; export PARAM_CleDnssecArn="$CLE"
          fi
          ALB=$(aws elbv2 describe-load-balancers --names alb-dev-leman-ADSN --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || true)
          [ -n "$ALB" ] && export PARAM_AlbDns="$ALB"
          # sprint 11 : WAF en us-east-1 (portée CloudFront) et liste de préfixes gérée de CloudFront
          if [ "$(jq -r .AvecCloudFront parameters/dev.json)" = true ]; then
            python scripts/deployer.py templates/us-east-1/11-waf.yaml parameters/dev.json \
              --region us-east-1 --role-cfn "${{ secrets.CFN_ROLE_ARN }}" $CONFIRMER
            WAF=$(aws cloudformation describe-stacks --region us-east-1 --stack-name portail-dev-waf \
              --query "Stacks[0].Outputs[?OutputKey=='AclWebArn'].OutputValue" --output text)
            PL=$(aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
              --query 'PrefixLists[0].PrefixListId' --output text)
            printf 'PARAM_AclWebArn=%s\nPARAM_PrefixeCloudFront=%s\n' "$WAF" "$PL" >> "$GITHUB_ENV"
            export PARAM_AclWebArn="$WAF" PARAM_PrefixeCloudFront="$PL"
          fi
          piles=$(ls templates/0[1-9]-*.yaml templates/1[0-9]-*.yaml 2>/dev/null | sort)
          [ "$ORDRE" = inverse ] && piles=$(echo "$piles" | sort -r)
          echo "ordre de déploiement ($ORDRE) : $(echo $piles | tr '\n' ' ')"
          for t in $piles; do
            python scripts/deployer.py "$t" parameters/dev.json --role-cfn "${{ secrets.CFN_ROLE_ARN }}" $CONFIRMER
          done
      - name: Associations TGW des VPN et de Direct Connect (sprints 7 et 8)
        run: bash scripts/associer_tgw.sh dev
      - name: Kubernetes (contrôleur ALB, certificat, application au digest signé)
        env:
          CLUSTER: eks-portail-dev-ADSN
          DIGEST: ${{ needs.construction.outputs.digest }}
        run: |
          echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
          if ! aws eks describe-cluster --name "$CLUSTER" > /dev/null 2>&1; then
            echo "pas de cluster $CLUSTER (AvecEks=false) : étape ignorée"; exit 0
          fi
          # copie de l'image signée GHCR -> ECR privé (manifeste copié tel quel : même digest, même signature)
          ECR=$(aws cloudformation list-exports --query "Exports[?Name=='portail-dev-DepotImages'].Value" --output text)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin > /dev/null
          aws ecr get-login-password | docker login "${ECR%%/*}" -u AWS --password-stdin > /dev/null
          docker buildx imagetools create -t "${ECR}:${GITHUB_SHA}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${ECR}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}'
          aws eks update-kubeconfig --name "$CLUSTER" > /dev/null
          VPC=$(aws cloudformation list-exports --query "Exports[?Name=='portail-dev-VpcId'].Value" --output text)
          helm repo add eks https://aws.github.io/eks-charts > /dev/null && helm repo update eks > /dev/null
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller --version 3.6.3 \
            -n kube-system --set clusterName="$CLUSTER" --set region="$AWS_REGION" --set vpcId="$VPC" \
            --set serviceAccount.create=true --set serviceAccount.name=aws-load-balancer-controller --wait --timeout 6m
          CERT=$(bash scripts/certificat.sh dev)
          cd k8s/overlays/dev
          kustomize edit set image "${IMAGE}=${ECR}@${DIGEST}"
          SGALB=$(aws cloudformation list-exports --query "Exports[?Name=='portail-dev-SgAlb'].Value" --output text)
          kustomize build . | sed "s#CERTIFICAT_ARN#${CERT}#; s#GROUPE_SECURITE_ALB#${SGALB}#" > /tmp/rendu.yaml
          pip install -q checkov && checkov -f /tmp/rendu.yaml --framework kubernetes --compact --quiet
          kubectl apply -f /tmp/rendu.yaml
          kubectl -n portail rollout status deploy/web --timeout=300s
          kubectl -n portail rollout status deploy/api --timeout=300s
          for i in $(seq 1 40); do
            HOTE=$(kubectl -n portail get ingress portail -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOTE" ] && break; sleep 15
          done
          echo "ALB : https://$HOTE" | tee -a "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 30); do curl -skf "https://$HOTE/api/health" && break; sleep 10; done
          echo; bash ../../../tests/connectivite/verifier.sh "https://$HOTE" | tee -a "$GITHUB_STEP_SUMMARY"
          # sprint 10 : surveillance et bascule DNS vers l'ALB (aucun changement si déjà en place)
          cd ../../..
          for t in templates/10-dns.yaml templates/11-cloudfront.yaml; do
            PARAM_AlbDns="$HOTE" PARAM_RoleDeploiementArn="${{ secrets.AWS_ROLE_ARN }}" \
              python scripts/deployer.py "$t" parameters/dev.json --role-cfn "${{ secrets.CFN_ROLE_ARN }}"
          done
          # sprint 11 : fichiers statiques dans le bucket privé (servis par CloudFront /static/*)
          BUCKET=$(aws cloudformation describe-stacks --stack-name portail-dev-cloudfront \
            --query "Stacks[0].Outputs[?OutputKey=='BucketStatique'].OutputValue" --output text 2>/dev/null || true)
          if [ -n "$BUCKET" ] && [ "$BUCKET" != None ]; then
            mkdir -p /tmp/statique/static
            python -c "import re; s = open('app/portail/__init__.py', encoding='utf-8').read(); open('/tmp/statique/static/portail.css', 'w').write(re.search(r'CSS = \"(.*?)\"', s).group(1))"
            aws s3 sync /tmp/statique "s3://$BUCKET" --cache-control "public, max-age=86400" --content-type text/css
            DIST=$(aws cloudformation describe-stacks --stack-name portail-dev-cloudfront \
              --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
            aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/static/*" --query Invalidation.Status --output text
          fi

  # ---------------------------------------------------------------- 5
  tests-dynamiques:
    name: 5 · Tests dynamiques et performance
    needs: deploiement-dev
    # Runner auto-hébergé dans le VPC (les runners GitHub n'atteignent pas les ressources privées)
    runs-on: [self-hosted, leman-vpc]
    if: vars.RUNNER_VPC == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Connectivité
        run: bash tests/connectivite/verifier.sh "${{ vars.URL_DEV }}"
      - name: OWASP ZAP baseline (DAST)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.URL_DEV }}
          rules_file_name: tests/dast/zap-regles.tsv
          fail_action: true
          allow_issue_writing: false
      - name: Charge k6 et SLO (p95 < 500 ms, erreurs < 0,5 %)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/charge/portail.js
          flags: --summary-export=docs/rapports/k6-dev.json
        env:
          URL_CIBLE: ${{ vars.URL_DEV }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with: {name: rapports-dev, path: "docs/rapports/\nreport_html.html"}

  # ---------------------------------------------------------------- 6
  deploiement-prod:
    name: 6 · Validation manuelle et prod
    needs: [deploiement-dev, tests-dynamiques]
    # Prod seulement sur demande explicite (workflow_dispatch prod=true), puis validation du relecteur
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.prod &&
      needs.deploiement-dev.result == 'success' && needs.tests-dynamiques.result != 'failure'
    runs-on: ubuntu-latest
    environment: prod   # relecteur obligatoire configuré sur l'environnement
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Piles CloudFormation prod
        run: |
          pip install boto3
          for t in templates/0[1-9]-*.yaml templates/1[0-9]-*.yaml; do
            [ -f "$t" ] || continue
            python scripts/deployer.py "$t" parameters/prod.json --role-cfn "${{ secrets.CFN_ROLE_ARN }}"
          done

  # ---------------------------------------------------------------- 7
  post-deploiement:
    name: 7 · Vérifications post-déploiement
    needs: deploiement-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Alarmes, conformité et dérive
        run: bash scripts/post_deploiement.sh | tee -a "$GITHUB_STEP_SUMMARY"
