# Diagnostic temporaire : affiche les revendications non secrètes du jeton OIDC GitHub.
name: diag-oidc
on:
  pull_request:
    paths: [".github/workflows/diag-oidc.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  revendications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const jeton = await core.getIDToken('sts.amazonaws.com');
            const charge = JSON.parse(Buffer.from(jeton.split('.')[1], 'base64url').toString());
            for (const cle of ['sub', 'aud', 'iss', 'repository', 'repository_owner', 'environment', 'ref', 'job_workflow_ref']) {
              core.info(`${cle} = ${charge[cle]}`);
            }
